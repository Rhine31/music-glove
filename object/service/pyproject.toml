[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "music-glove-analysis-service"
version = "0.1.0"
description = "Music Glove humming-to-MIDI and instrument rendering API"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.116,<1.0",
  "python-multipart>=0.0.20,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
analysis = [
  "basic-pitch==0.4.0",
  "scikit-learn<=1.5.1",
]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
